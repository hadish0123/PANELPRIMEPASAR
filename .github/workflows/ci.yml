name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: panelprimepasar
          POSTGRES_PASSWORD: panelprimepasar
          POSTGRES_DB: panelprimepasar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panelprimepasar -d panelprimepasar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://panelprimepasar:panelprimepasar@localhost:5432/panelprimepasar
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Apply migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest --cov=panelprimepasar --cov-report=term-missing

      - name: Migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Browser end-to-end
        run: |
          playwright install --with-deps chromium
          python tests/browser/admin_flow.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: browser-artifacts/
          if-no-files-found: ignore

      - name: Docker build
        run: docker build -t panelprimepasar:test .
