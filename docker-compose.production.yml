services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: panelprimepasar
      POSTGRES_DB: panelprimepasar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U panelprimepasar -d panelprimepasar']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment: &app_environment
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://panelprimepasar:${POSTGRES_PASSWORD}@postgres:5432/panelprimepasar
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: .
    env_file: .env
    environment: *app_environment
    command: [uvicorn, 'panelprimepasar.api:app', --host, 0.0.0.0, --port, '8080']
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
