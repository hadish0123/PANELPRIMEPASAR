[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panelprimepasar"
version = "0.1.0"
description = "Production-grade Telegram sales and PasarGuard provisioning bot"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.26,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "cryptography>=46,<47",
  "structlog>=25,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panelprimepasar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["panelprimepasar"]
